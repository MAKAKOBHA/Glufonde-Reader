<svg xmlns="http://www.w3.org/2000/svg" width="940" height="940" viewBox="0 0 940 940" role="img" aria-labelledby="title desc">
<title id="title">Штрафы на дальность стрельбы</title>
<desc id="desc">Схема зон: в центре преимущество и проверка Физиологии против Моторики, далее обычная сложность, за ней повышение сложности на 2 за каждые следующие две клетки.</desc>
