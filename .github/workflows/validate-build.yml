name: Validate RuleBook build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tools/*.js; do node --check "$file"; done
      - name: Check referenced assets\n        run: node tools/check-assets.js\n      - name: Validate Markdown and published book synchronization
        run: node tools/build.js --check
